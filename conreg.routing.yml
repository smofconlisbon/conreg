conreg_register:
  path: 'members/register/{eid}'
  defaults:
    _title: 'Registration'
    _form: '\Drupal\conreg\Form\Registration'
    eid: 1
    return: ''
  requirements:
    _permission: 'convention registration'
    eid: ^[0-9]+$

conreg_fantable_register:
  path: 'admin/members/fantable/register/{eid}'
  defaults:
    _title: 'Registration'
    _form: '\Drupal\conreg\Form\Registration'
    eid: 1
    return: 'fantable'
  requirements:
    _permission: 'fan table registration'
    eid: ^[0-9]+$

conreg_portal_register:
  path: 'members/portal/register/{eid}'
  defaults:
    _title: 'Registration'
    _form: '\Drupal\conreg\Form\Registration'
    eid: 1
    return: 'portal'
  requirements:
    _permission: 'member portal'
    eid: ^[0-9]+$
  options:
    no_cache: true

conreg_checkout:
  path: 'members/checkout/{payid}/{key}'
  defaults:
    _title: 'Payment'
    _form: '\Drupal\conreg\Form\Checkout'
    return: ''
  requirements:
    _permission: 'convention registration'
    payid: ^[0-9]+$
    key: ^[0-9]+$
  options:
    no_cache: true

