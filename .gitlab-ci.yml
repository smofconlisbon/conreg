    "js/html2canvas.min.js"
  _CSPELL_WORDS:
    "addonid,badgename,datefrom,dateto,dont,fantable,firstname,fontawesome,geoplugin,invitebot,lastname,lineid,mailout,mailouts,memberno,mymodule,optid,payid,paysessionid,regform,upgid,tshirt"
